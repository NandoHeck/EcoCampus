<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EcoCampus">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#3055d8"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#15296f"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- anéis (sonar) -->
  <g fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2">
    <circle cx="256" cy="220" r="150"/>
    <circle cx="256" cy="220" r="105"/>
    <circle cx="256" cy="220" r="60"/>
  </g>

  <!-- folhinha (símbolo eco) -->
  <path d="M256 130
           C 320 130, 372 176, 372 232
           C 372 288, 322 336, 256 336
           C 236 336, 218 332, 200 322
           C 200 262, 224 208, 268 174
           C 232 200, 210 246, 210 300
           C 200 288, 188 264, 188 232
           C 188 176, 208 130, 256 130 Z"
        fill="url(#dot)" filter="url(#glow)"/>

  <!-- letra E discreta -->
  <text x="256" y="440" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="72" font-weight="800"
        fill="#ffffff" letter-spacing="6">ECO</text>
</svg>
