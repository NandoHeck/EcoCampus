<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15296f">
  <title>Anúncios — EcoCampus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/img/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EcoCampus">
  <meta name="application-name" content="EcoCampus">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>

<body class="page-bg">
  <div id="app-navbar"></div>

  <main class="listing">
    <div class="shell">
      <header class="listing-head animate-on-scroll">
        <div>
          <span class="kicker">Explorar</span>
          <h1 class="t-h2">Encontre o que precisa no campus</h1>
          <p class="t-paragraph" style="margin-top:.5rem">
            Filtre por categoria, tipo ou faça uma busca rápida.
          </p>
        </div>

        <div class="listing-filters">
          <div class="search-field">
            <iconify-icon icon="lucide:search"></iconify-icon>
            <input class="form-input" type="search" id="q" placeholder="O que você procura?" aria-label="Buscar">
          </div>
          <select class="form-select" id="type-filter" aria-label="Filtrar por tipo">
            <option value="">Todos os tipos</option>
            <option value="sale">Venda</option>
            <option value="donation">Doação</option>
          </select>
          <select class="form-select" id="sort-select" aria-label="Ordenar por">
            <option value="recent">Mais recentes</option>
            <option value="views">Mais vistos</option>
            <option value="price-asc">Menor preço</option>
            <option value="price-desc">Maior preço</option>
          </select>
        </div>

        <div class="filter-chips" id="cat-chips" role="tablist" aria-label="Categorias"></div>

        <div class="listing-count">
          <span id="count-label">Carregando…</span>
          <a href="/pages/criar-anuncio.html" class="t-accent" style="font-weight:600">
            <iconify-icon icon="lucide:plus"></iconify-icon> Publicar novo
          </a>
        </div>
      </header>

      <div class="ad-grid" id="ads-grid"></div>
    </div>
  </main>

  <div id="app-bottom-nav"></div>

  <script type="module" src="/js/pages/anuncios.js"></script>
</body>
</html>
