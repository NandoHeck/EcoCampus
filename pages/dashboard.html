<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15296f">
  <title>Dashboard — EcoCampus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>

<body class="page-bg">
  <div id="app-navbar"></div>

  <main class="dash">
    <div class="shell">
      <header class="dash-head animate-on-scroll">
        <div>
          <h1>Olá, <span id="greeting-name">estudante</span> 👋</h1>
          <p>Explore anúncios recentes, descubra doações e organize seus favoritos.</p>
        </div>
        <a href="/pages/criar-anuncio.html" class="btn-primary">
          <iconify-icon icon="lucide:plus"></iconify-icon> Anunciar item
        </a>
      </header>

      <!-- Search + filtros rápidos -->
      <div class="listing-filters animate-on-scroll" style="margin-bottom:1.6rem">
        <div class="search-field">
          <iconify-icon icon="lucide:search"></iconify-icon>
          <input class="form-input" type="search" id="q" placeholder="Buscar por título, categoria ou descrição..." aria-label="Buscar">
        </div>
        <select class="form-select" id="type-filter" aria-label="Filtrar por tipo">
          <option value="">Todos os tipos</option>
          <option value="sale">Venda</option>
          <option value="donation">Doação</option>
        </select>
        <select class="form-select" id="cat-filter" aria-label="Filtrar por categoria">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <!-- Estatísticas -->
      <div class="stats-grid" id="stats-grid">
        <div class="skeleton skeleton--card" style="height:120px"></div>
        <div class="skeleton skeleton--card" style="height:120px"></div>
        <div class="skeleton skeleton--card" style="height:120px"></div>
        <div class="skeleton skeleton--card" style="height:120px"></div>
      </div>

      <!-- Categorias rápidas -->
      <section class="dash-section animate-on-scroll">
        <div class="dash-section__head">
          <h2>Categorias populares</h2>
          <a href="/pages/anuncios.html">Ver tudo <iconify-icon icon="lucide:arrow-right"></iconify-icon></a>
        </div>
        <div class="cat-scroll" id="cat-scroll"></div>
      </section>

      <!-- Em destaque -->
      <section class="dash-section animate-on-scroll">
        <div class="dash-section__head">
          <h2>Em destaque</h2>
          <a href="/pages/anuncios.html?sortBy=views">Mais vistos <iconify-icon icon="lucide:arrow-right"></iconify-icon></a>
        </div>
        <div class="ad-grid" id="featured-grid"></div>
      </section>

      <!-- Recentes -->
      <section class="dash-section animate-on-scroll">
        <div class="dash-section__head">
          <h2>Anúncios recentes</h2>
          <a href="/pages/anuncios.html">Ver todos <iconify-icon icon="lucide:arrow-right"></iconify-icon></a>
        </div>
        <div class="ad-grid" id="recent-grid"></div>
      </section>
    </div>
  </main>

  <div id="app-bottom-nav"></div>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
