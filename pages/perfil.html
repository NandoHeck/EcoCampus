<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15296f">
  <title>Meu perfil — EcoCampus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>

<body class="page-bg">
  <div id="app-navbar"></div>

  <main class="profile">
    <div class="shell">
      <header class="profile-head animate-on-scroll" id="profile-head">
        <div class="skeleton" style="width:88px;height:88px;border-radius:50%"></div>
        <div class="profile-head__info">
          <div class="skeleton skeleton--title" style="width:180px"></div>
          <div class="skeleton skeleton--text" style="width:220px"></div>
        </div>
      </header>

      <div class="profile-tabs animate-on-scroll" role="tablist">
        <button type="button" class="profile-tab is-active" role="tab" data-tab="meus-anuncios" id="meus-anuncios">
          <iconify-icon icon="lucide:megaphone"></iconify-icon> Meus anúncios
        </button>
        <button type="button" class="profile-tab" role="tab" data-tab="favoritos">
          <iconify-icon icon="lucide:heart"></iconify-icon> Favoritos
        </button>
        <button type="button" class="profile-tab" role="tab" data-tab="editar">
          <iconify-icon icon="lucide:user-cog"></iconify-icon> Editar perfil
        </button>
      </div>

      <section id="tab-meus-anuncios" class="profile-panel">
        <div class="ad-grid" id="my-ads-grid"></div>
      </section>

      <section id="tab-favoritos" class="profile-panel hidden">
        <div class="ad-grid" id="my-favs-grid"></div>
      </section>

      <section id="tab-editar" class="profile-panel hidden">
        <div class="form-container" style="margin:0">
          <h2 style="font-size:20px;font-weight:700;margin-bottom:1.2rem">Dados do perfil</h2>
          <form id="profile-form">
            <div class="form-field" data-field="name">
              <label class="form-label" for="p-name">Nome</label>
              <input class="form-input" id="p-name" name="name" type="text">
              <span class="form-error" data-error>Nome inválido.</span>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="p-uni">Universidade</label>
                <input class="form-input" id="p-uni" name="university" type="text">
              </div>
              <div class="form-field">
                <label class="form-label" for="p-course">Curso</label>
                <input class="form-input" id="p-course" name="course" type="text">
              </div>
            </div>
            <div class="form-field">
              <label class="form-label" for="p-avatar">URL do avatar</label>
              <input class="form-input" id="p-avatar" name="avatar" type="url" placeholder="https://...">
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="submit" id="p-submit">
                <span data-label>Salvar alterações</span>
                <iconify-icon icon="lucide:check" data-icon></iconify-icon>
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div id="app-bottom-nav"></div>

  <script type="module" src="/js/pages/perfil.js"></script>
</body>
</html>
